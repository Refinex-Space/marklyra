<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MarkLyra 站点导航原型</title>
<style>
/* Tokens mirror packages/editor-themes/liquid-glass.css (subset) so the prototype reads like the app. */
:root {
  --lg-radius-xs: 6px; --lg-radius-control: 8px; --lg-radius-item: 8px; --lg-radius-pane: 12px;
  --lg-radius-popover: 14px; --lg-radius-dialog: 20px; --lg-radius-capsule: 999px; --lg-popover-padding: 6px;
  --lg-accent: #2f74d0; --lg-accent-fill: var(--lg-accent); --lg-accent-ink: #fff; --lg-danger: #d1383d;
  --lg-hover: rgb(0 0 0 / .05); --lg-pressed: rgb(0 0 0 / .09);
  --lg-selected: color-mix(in srgb, var(--lg-accent) 14%, transparent);
  --lg-selected-strong: color-mix(in srgb, var(--lg-accent) 22%, transparent);
  --lg-hairline: rgb(0 0 0 / .08); --lg-separator: rgb(0 0 0 / .07);
  --lg-fill-regular: rgb(252 252 253 / .74); --lg-fill-thick: rgb(250 250 251 / .86);
  --lg-fill-pane: rgb(255 255 255 / .42); --lg-fill-control: rgb(255 255 255 / .62);
  --lg-sheen: linear-gradient(180deg, rgb(255 255 255 / .5), rgb(255 255 255 / 0) 50%);
  --lg-pane-sheen: radial-gradient(120% 42% at 0% 0%, rgb(255 255 255 / .62), rgb(255 255 255 / 0) 62%), linear-gradient(180deg, rgb(255 255 255 / .34), rgb(255 255 255 / .08) 36%, rgb(255 255 255 / 0));
  --lg-filter-regular: blur(28px) saturate(1.8); --lg-filter-thick: blur(36px) saturate(1.6);
  --lg-edge: rgb(20 30 60 / .11);
  --lg-rim: inset 0 1px 0 0 rgb(255 255 255 / .95), inset 0 -1px 0 0 rgb(255 255 255 / .45), inset 0 0 0 1px rgb(255 255 255 / .55), inset 0 0 20px -6px rgb(255 255 255 / .85);
  --lg-depth-pane: 0 1px 2px rgb(24 34 64 / .06), 0 14px 36px -18px rgb(24 34 64 / .26);
  --lg-depth-control: 0 1px 2px rgb(24 34 64 / .08), 0 4px 12px -4px rgb(24 34 64 / .16);
  --lg-depth-popover: 0 2px 8px rgb(24 34 64 / .08), 0 18px 44px -12px rgb(24 34 64 / .3);
  --lg-depth-dialog: 0 4px 14px rgb(24 34 64 / .1), 0 36px 84px -22px rgb(24 34 64 / .42);
  --lg-surface-regular: var(--lg-sheen), var(--lg-fill-regular);
  --lg-surface-thick: var(--lg-sheen), var(--lg-fill-thick);
  --lg-surface-control: var(--lg-sheen), var(--lg-fill-control);
  --lg-surface-pane: var(--lg-pane-sheen), var(--lg-fill-pane);
  --lg-shadow-pane: var(--lg-rim), var(--lg-depth-pane);
  --lg-shadow-control: var(--lg-rim), var(--lg-depth-control);
  --lg-shadow-popover: var(--lg-rim), var(--lg-depth-popover);
  --lg-shadow-dialog: var(--lg-rim), var(--lg-depth-dialog);
  --lg-bead-fill: linear-gradient(180deg, rgb(255 255 255 / .95), rgb(255 255 255 / .72));
  --lg-bead-shadow: inset 0 1px 0 #fff, inset 0 0 0 1px rgb(255 255 255 / .5), 0 0 0 .5px rgb(24 34 64 / .12), 0 1px 2px rgb(24 34 64 / .12), 0 3px 8px -2px rgb(24 34 64 / .16);
  --lg-scrim: rgb(0 0 0 / .16);
  --lg-ease-spring: cubic-bezier(.34, 1.32, .64, 1); --lg-ease-out: cubic-bezier(.22, 1, .36, 1);
  --lg-duration-fast: 120ms; --lg-duration: 200ms; --lg-duration-slow: 320ms; --lg-press-scale: .97;
  --lg-ambient-a: color-mix(in srgb, var(--lg-accent) 24%, transparent);
  --lg-ambient-b: color-mix(in srgb, #8a63d2 18%, transparent);
  --body-bg: #ffffff; --ink: #1f2328; --ink-2: #59636e; --ink-3: #8b949e;
  --canvas: color-mix(in srgb, var(--body-bg) 91%, var(--ink));
  /* Proposed new tokens: group label colours (soft = 16% tint for letter marks). */
  --lab-red: #d9483b; --lab-orange: #e07a1f; --lab-amber: #c99400; --lab-green: #2f9e57; --lab-teal: #129c8f;
  --lab-cyan: #1793c4; --lab-blue: #2f74d0; --lab-indigo: #5560d6; --lab-purple: #8a55c9; --lab-pink: #cf4b8a; --lab-gray: #7a828c;
  --site-card-hover-depth: 0 1px 2px rgb(24 34 64 / .08), 0 10px 24px -10px rgb(24 34 64 / .28);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --lg-accent: #4d97ff; --lg-accent-fill: color-mix(in srgb, var(--lg-accent) 70%, #000); --lg-danger: #ff6b6b;
  --lg-hover: rgb(255 255 255 / .07); --lg-pressed: rgb(255 255 255 / .11);
  --lg-selected: color-mix(in srgb, var(--lg-accent) 20%, transparent);
  --lg-selected-strong: color-mix(in srgb, var(--lg-accent) 30%, transparent);
  --lg-hairline: rgb(255 255 255 / .09); --lg-separator: rgb(255 255 255 / .08);
  --lg-fill-regular: rgb(34 36 42 / .72); --lg-fill-thick: rgb(30 32 38 / .86);
  --lg-fill-pane: rgb(255 255 255 / .035); --lg-fill-control: rgb(255 255 255 / .08);
  --lg-sheen: linear-gradient(180deg, rgb(255 255 255 / .06), rgb(255 255 255 / 0) 50%);
  --lg-pane-sheen: radial-gradient(120% 42% at 0% 0%, rgb(255 255 255 / .06), rgb(255 255 255 / 0) 62%);
  --lg-edge: rgb(255 255 255 / .1);
  --lg-rim: inset 0 1px 0 0 rgb(255 255 255 / .08), inset 0 0 0 1px rgb(255 255 255 / .04);
  --lg-depth-pane: 0 1px 2px rgb(0 0 0 / .3), 0 14px 36px -18px rgb(0 0 0 / .6);
  --lg-depth-control: 0 1px 2px rgb(0 0 0 / .3), 0 4px 12px -4px rgb(0 0 0 / .4);
  --lg-depth-popover: 0 2px 8px rgb(0 0 0 / .3), 0 18px 44px -12px rgb(0 0 0 / .6);
  --lg-depth-dialog: 0 4px 14px rgb(0 0 0 / .35), 0 36px 84px -22px rgb(0 0 0 / .7);
  --lg-bead-fill: linear-gradient(180deg, rgb(255 255 255 / .14), rgb(255 255 255 / .08));
  --lg-bead-shadow: inset 0 1px 0 rgb(255 255 255 / .12), 0 0 0 .5px rgb(0 0 0 / .5), 0 2px 6px -2px rgb(0 0 0 / .5);
  --lg-scrim: rgb(0 0 0 / .4);
  --lg-ambient-a: color-mix(in srgb, var(--lg-accent) 9%, transparent);
  --lg-ambient-b: color-mix(in srgb, #8a63d2 7%, transparent);
  --body-bg: #16181d; --ink: #e6e8eb; --ink-2: #a3abb5; --ink-3: #737b85;
  --canvas: color-mix(in srgb, var(--body-bg) 94%, var(--ink));
  --lab-red: #f07467; --lab-orange: #f29a4a; --lab-amber: #e3b437; --lab-green: #5cc47f; --lab-teal: #44c2b4;
  --lab-cyan: #4fb8e3; --lab-blue: #5d9df5; --lab-indigo: #8089f0; --lab-purple: #b085e6; --lab-pink: #ee7fb2; --lab-gray: #9aa2ac;
  --site-card-hover-depth: 0 1px 2px rgb(0 0 0 / .35), 0 10px 24px -10px rgb(0 0 0 / .7);
  color-scheme: dark;
}
@media (prefers-reduced-motion: reduce) { :root { --lg-duration-fast: 0ms; --lg-duration: 0ms; --lg-duration-slow: 0ms; --lg-press-scale: 1; } }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei UI", "Segoe UI", sans-serif;
  color: var(--ink);
  background: radial-gradient(60% 50% at 0% 0%, var(--lg-ambient-a), transparent 70%), radial-gradient(60% 50% at 100% 100%, var(--lg-ambient-b), transparent 70%), var(--canvas);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
button { font: inherit; color: inherit; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- Prototype control strip (not part of the product) ---------- */
.proto { position: fixed; left: 50%; bottom: 14px; translate: -50% 0; z-index: 100; display: flex; gap: 6px; align-items: center;
  padding: 5px; border-radius: 999px; background: var(--lg-surface-regular); -webkit-backdrop-filter: var(--lg-filter-regular); backdrop-filter: var(--lg-filter-regular);
  border: 1px solid var(--lg-edge); box-shadow: var(--lg-shadow-popover); font-size: 12px; }
.proto b { padding: 0 8px 0 10px; color: var(--ink-3); font-weight: 600; letter-spacing: .02em; }
.proto button { border: 0; background: transparent; padding: 5px 11px; border-radius: 999px; cursor: pointer; color: var(--ink-2); }
.proto button:hover { background: var(--lg-hover); }
.proto button[aria-pressed="true"] { background: var(--lg-bead-fill); box-shadow: var(--lg-bead-shadow); color: var(--ink); }
.proto .sep { width: 1px; height: 16px; background: var(--lg-separator); }

/* ---------- Window shell ---------- */
.app { position: fixed; inset: 0; display: flex; flex-direction: column; min-width: 980px; }
.titlebar { height: 28px; flex: none; display: flex; align-items: center; padding: 0 8px; gap: 2px; user-select: none; position: relative; }
.lights { display: flex; gap: 8px; padding: 0 10px 0 6px; }
.lights span { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .15); }
.lights span:nth-child(2) { background: #febc2e; } .lights span:nth-child(3) { background: #28c840; }
.tb-btn { width: 26px; height: 22px; border: 0; background: transparent; border-radius: var(--lg-radius-xs); display: grid; place-items: center; color: var(--ink-2); cursor: pointer; position: relative; }
.tb-btn:hover { background: var(--lg-hover); color: var(--ink); }
.tb-btn[aria-pressed="true"] { background: var(--lg-selected); color: var(--lg-accent); }
.tb-btn[disabled] { opacity: .35; cursor: default; }
.tb-title { position: absolute; left: 50%; translate: -50% 0; font-weight: 600; font-size: 13px; color: var(--ink); display: flex; align-items: center; gap: 6px; }
.tb-title small { font-weight: 400; color: var(--ink-3); }
.tb-spacer { flex: 1; }
.tb-btn .tip { position: absolute; top: 26px; right: 0; white-space: nowrap; padding: 4px 8px; font-size: 11.5px; border-radius: 8px; pointer-events: none; opacity: 0; transition: opacity var(--lg-duration-fast);
  background: var(--lg-surface-regular); -webkit-backdrop-filter: var(--lg-filter-regular); backdrop-filter: var(--lg-filter-regular); border: 1px solid var(--lg-edge); box-shadow: var(--lg-shadow-popover); color: var(--ink); z-index: 30; }
.tb-btn:hover .tip { opacity: 1; transition-delay: 500ms; }
.tb-btn.new::after { content: ""; position: absolute; top: 2px; right: 3px; width: 6px; height: 6px; border-radius: 50%; background: var(--lg-accent); box-shadow: 0 0 0 2px var(--canvas); }

.workspace { flex: 1; min-height: 0; display: flex; gap: 4px; padding: 0 8px 8px; }
.pane { background: var(--lg-surface-pane); border: 1px solid var(--lg-edge); border-radius: var(--lg-radius-pane); box-shadow: var(--lg-shadow-pane); }
.sidebar { width: 268px; flex: none; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.main { flex: 1; min-width: 0; background: var(--body-bg); border: 1px solid var(--lg-edge); border-radius: var(--lg-radius-pane); box-shadow: var(--lg-depth-pane); overflow: hidden; display: flex; flex-direction: column; position: relative; }

/* ---------- Sidebar: group tree ---------- */
.sb-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 10px 6px 14px; }
.sb-head h2 { margin: 0; font-size: 13px; font-weight: 600; display: flex; gap: 7px; align-items: center; }
.sb-head h2 svg { color: var(--lg-accent); }
.icon-btn { width: 26px; height: 26px; border: 0; background: transparent; border-radius: var(--lg-radius-xs); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--lg-hover); color: var(--ink); }
.icon-btn:active { scale: var(--lg-press-scale); }
.sb-scroll { flex: 1; overflow: auto; padding: 2px 6px 10px; scrollbar-width: thin; }
.sb-label { font-size: 11px; font-weight: 600; color: var(--ink-3); padding: 12px 10px 4px; letter-spacing: .04em; display: flex; justify-content: space-between; align-items: center; }
.row { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 8px; border-radius: var(--lg-radius-item); cursor: pointer; position: relative; outline: none; }
.row:hover { background: var(--lg-hover); }
.row:focus-visible { box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--lg-accent) 45%, transparent); }
.row[aria-selected="true"] { background: var(--lg-selected); }
.row[aria-selected="true"] .row-name { font-weight: 600; }
.row.drop { background: var(--lg-selected-strong); box-shadow: inset 0 0 0 1.5px var(--lg-accent); }
.row .chev { width: 14px; height: 14px; color: var(--ink-3); transition: rotate var(--lg-duration) var(--lg-ease-out); stroke-width: 2; }
.row .chev.open { rotate: 90deg; }
.row .chev-space { width: 14px; flex: none; }
.row .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .15); }
.row .dot.hollow { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.row .row-icon { color: var(--ink-2); width: 15px; height: 15px; }
.row-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-count { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.row.child { padding-left: 30px; }
.row input.rename { flex: 1; min-width: 0; height: 22px; border: 1px solid var(--lg-accent); border-radius: 6px; padding: 0 6px; font: inherit; background: var(--body-bg); color: var(--ink); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--lg-accent) 18%, transparent); }
.sb-foot { border-top: 1px solid var(--lg-separator); padding: 8px 12px; font-size: 11.5px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.sb-foot code { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--lg-hover); padding: 1px 5px; border-radius: 4px; color: var(--ink-2); }

/* ---------- Main: search hero ---------- */
.main-scroll { flex: 1; overflow: auto; scrollbar-width: thin; }
.hero { padding: clamp(32px, 10vh, 96px) 48px 22px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.hero-mark { font-size: 26px; font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; color: var(--ink); }
.hero-mark span { color: var(--ink-3); font-weight: 400; font-size: 14px; }
.search-wrap { position: relative; width: min(640px, 100%); }
.search { height: 50px; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 6px; border-radius: var(--lg-radius-capsule);
  background: var(--lg-surface-control), color-mix(in srgb, var(--body-bg) 96%, var(--ink)); border: 1px solid var(--lg-edge); box-shadow: var(--lg-shadow-control); transition: box-shadow var(--lg-duration-fast); }
.search:focus-within { box-shadow: var(--lg-shadow-control), 0 0 0 3px color-mix(in srgb, var(--lg-accent) 18%, transparent); }
.engine-btn { height: 38px; display: flex; align-items: center; gap: 4px; padding: 0 6px 0 6px; border: 0; border-radius: var(--lg-radius-capsule); background: transparent; cursor: pointer; color: var(--ink-2); }
.engine-btn:hover { background: var(--lg-hover); }
.engine-btn .chev { width: 12px; height: 12px; stroke-width: 2; }
.engine-logo { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; flex: none; }
.search .divider { width: 1px; height: 22px; background: var(--lg-separator); margin: 0 4px; }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 15.5px; color: var(--ink); height: 100%; }
.search input::placeholder { color: var(--ink-3); }
.kbd { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-3); border: 1px solid var(--lg-hairline); border-bottom-width: 2px; border-radius: 5px; padding: 1px 6px; background: var(--body-bg); }
.search-go { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--lg-accent-fill); color: var(--lg-accent-ink); display: grid; place-items: center; cursor: pointer; }
.search-go:active { scale: var(--lg-press-scale); }
.search-hint { font-size: 12px; color: var(--ink-3); display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.search-hint em { font-style: normal; color: var(--ink-2); }
.search-error { color: var(--lg-danger); font-size: 12px; text-align: center; min-height: 0; }

.popover { position: absolute; z-index: 40; background: var(--lg-surface-regular); -webkit-backdrop-filter: var(--lg-filter-regular); backdrop-filter: var(--lg-filter-regular);
  border: 1px solid var(--lg-edge); border-radius: var(--lg-radius-popover); padding: var(--lg-popover-padding); box-shadow: var(--lg-shadow-popover);
  animation: lg-materialize var(--lg-duration) var(--lg-ease-spring); }
@keyframes lg-materialize { from { opacity: 0; scale: .96; translate: 0 -4px; } }
@keyframes lg-fade { from { opacity: 0; } }
.suggest { left: 0; right: 0; top: 56px; }
.sg-label { font-size: 11px; color: var(--ink-3); font-weight: 600; padding: 6px 10px 3px; }
.sg-item { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: var(--lg-radius-item); cursor: pointer; }
.sg-item[aria-selected="true"] { background: var(--lg-selected); }
.sg-item:hover:not([aria-selected="true"]) { background: var(--lg-hover); }
.sg-item .mono { width: 22px; height: 22px; border-radius: 6px; font-size: 11px; }
.sg-item .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sg-item .s { color: var(--ink-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.sg-item mark { background: transparent; color: var(--lg-accent); font-weight: 600; }
.sg-item .ret { margin-left: auto; color: var(--ink-3); font-size: 11px; display: none; }
.sg-item[aria-selected="true"] .ret { display: inline; }
.sg-sep { height: 1px; background: var(--lg-separator); margin: 4px 6px; }
.engine-menu { top: 50px; left: 0; width: 248px; }
.menu-item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: var(--lg-radius-item); cursor: pointer; }
.menu-item:hover, .menu-item.active-key { background: var(--lg-hover); }
.menu-item .check { margin-left: auto; color: var(--lg-accent); }
.menu-item .kw { margin-left: auto; color: var(--ink-3); font-size: 11.5px; }
.menu-item.danger { color: var(--lg-danger); }
.menu-sep { height: 1px; background: var(--lg-separator); margin: 4px 6px; }
.menu-item .engine-logo { width: 20px; height: 20px; font-size: 11px; }

/* Pinned speed dial */
.pinned { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; max-width: 720px; margin-top: 4px; }
.pin { width: 82px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 4px 8px; border-radius: 14px; cursor: pointer; border: 0; background: transparent; }
.pin:hover { background: var(--lg-hover); }
.pin:active { scale: var(--lg-press-scale); }
.pin .mono { width: 46px; height: 46px; border-radius: 14px; font-size: 19px; box-shadow: var(--lg-depth-control); }
.pin span { font-size: 12px; color: var(--ink-2); max-width: 74px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pin.add .mono { background: var(--lg-hover); color: var(--ink-3); box-shadow: none; border: 1.5px dashed var(--lg-hairline); }

/* Letter mark / fetched icon */
.mono { display: grid; place-items: center; font-weight: 650; flex: none; position: relative; overflow: hidden; }
.mono.fetching::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgb(255 255 255 / .45) 50%, transparent 70%); animation: sweep 1.2s linear infinite; }
@keyframes sweep { from { translate: -100% 0; } to { translate: 100% 0; } }
.mono svg { width: 58%; height: 58%; }

/* ---------- Group header & grid ---------- */
.content { padding: 4px 40px 72px; max-width: 1240px; margin: 0 auto; }
.ghead { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 14px 0 12px; background: var(--body-bg);
  -webkit-mask-image: linear-gradient(180deg, #000 82%, transparent); mask-image: linear-gradient(180deg, #000 82%, transparent); }
.ghead h1 { font-size: 17px; margin: 0; font-weight: 650; display: flex; align-items: center; gap: 9px; }
.ghead h1 .dot { width: 10px; height: 10px; border-radius: 50%; }
.ghead .count { color: var(--ink-3); font-size: 13px; font-weight: 400; }
.ghead .grow { flex: 1; }
.seg { display: inline-flex; padding: 2px; border-radius: 999px; background: var(--lg-hover); position: relative; }
.seg button { border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 999px; cursor: pointer; color: var(--ink-2); display: flex; align-items: center; gap: 5px; font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--lg-surface-control), var(--body-bg); box-shadow: var(--lg-shadow-control); color: var(--ink); }
.btn { height: 30px; padding: 0 14px; border-radius: 999px; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.btn:active { scale: var(--lg-press-scale); }
.btn.primary { background: var(--lg-accent-fill); color: var(--lg-accent-ink); box-shadow: var(--lg-depth-control); }
.btn.secondary { background: var(--lg-surface-control), var(--body-bg); box-shadow: var(--lg-shadow-control); border: 1px solid var(--lg-edge); }
.btn.danger { background: var(--lg-danger); color: #fff; }
.select-btn { height: 28px; padding: 0 8px 0 10px; border-radius: 8px; border: 1px solid var(--lg-edge); background: var(--lg-surface-control), var(--body-bg); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 12px; color: var(--ink-2); }

.section-title { display: flex; align-items: center; gap: 8px; margin: 22px 0 10px; font-weight: 600; font-size: 13.5px; cursor: pointer; user-select: none; }
.section-title .bar { width: 3px; height: 14px; border-radius: 2px; }

const groupIds = (id) => [id, ...childrenOf(id).map((g) => g.id)];
const countOf = (id) => sites.filter((s) => groupIds(id).includes(s.group)).length;

// ------------------------------------------------------------------ query classification (spec §3.2)
function classifyQuery(raw) {
  let q = raw.trim(); if (!q) return null;
  let engine = engineOf();
  const kw = q.match(/^(\S+)\s+(.+)$/);
  if (kw) { const e = engines.find((x) => x.keyword === kw[1]); if (e) { engine = e; q = kw[2]; return { kind: 'search', engine, q, url: e.template.replace('%s', encodeURIComponent(q)) }; } }
  if (/^https?:\/\/\S+$/i.test(q)) return { kind: 'url', url: q };
  const local = /^(localhost|(\d{1,3}\.){3}\d{1,3})(:\d+)?(\/\S*)?$/i.test(q);
  if (local) return { kind: 'url', url: 'http://' + q };
  if (!/\s/.test(q) && /^[\w-]+(\.[\w-]+)*\.[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(q)) return { kind: 'url', url: 'https://' + q };
  return { kind: 'search', engine, q, url: engine.template.replace('%s', encodeURIComponent(q)) };
}
function suggestions() {
  const q = st.query.trim().toLowerCase(); if (!q) return [];
  const out = [];
  const hits = sites.filter((s) => (s.title + ' ' + host(s.url) + ' ' + s.description).toLowerCase().includes(q)).slice(0, 5);
  hits.forEach((s) => out.push({ type: 'site', site: s }));
  const c = classifyQuery(st.query);
  if (c?.kind === 'url') out.push({ type: 'url', url: c.url });
  const e = c?.kind === 'search' ? c.engine : engineOf();
  out.push({ type: 'search', engine: e, q: c?.kind === 'search' ? c.q : st.query.trim(), url: e.template.replace('%s', encodeURIComponent(c?.kind === 'search' ? c.q : st.query.trim())) });
  return out;
}
const hl = (text, q) => { const i = text.toLowerCase().indexOf(q.toLowerCase()); return i < 0 || !q ? esc(text) : esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length)); };

// ------------------------------------------------------------------ search behaviour
function bindSearch() {
  const q = document.getElementById('q'); if (!q) return;
  q.addEventListener('compositionstart', () => (st.composing = true));
  q.addEventListener('compositionend', () => { st.composing = false; st.query = q.value; st.suggest = 0; renderSuggest(); });
  q.addEventListener('input', () => { const k = q.parentElement.querySelector('.kbd'); if (k) k.hidden = !!q.value; if (st.composing) return; st.query = q.value; st.suggest = 0; st.error = ''; document.getElementById('searchError').textContent = ''; renderSuggest(); });
  q.addEventListener('focus', () => st.query && renderSuggest());
  q.addEventListener('keydown', (ev) => {
    if (ev.isComposing || st.composing) return; // IME: Enter only commits the candidate.
    const list = suggestions();
    if (ev.key === 'Tab') { ev.preventDefault(); const i = engines.findIndex((e) => e.id === (st.tempEngine || st.engine)); st.tempEngine = engines[(i + (ev.shiftKey ? engines.length - 1 : 1)) % engines.length].id; const keep = q.value; render(); const n = document.getElementById('q'); n.focus(); n.value = keep; n.setSelectionRange(keep.length, keep.length); if (keep) renderSuggest(); return; }
    if (ev.key === 'ArrowDown') { ev.preventDefault(); st.suggest = Math.min(list.length - 1, st.suggest + 1); renderSuggest(); }
    else if (ev.key === 'ArrowUp') { ev.preventDefault(); st.suggest = Math.max(0, st.suggest - 1); renderSuggest(); }

    const card = ev.target.closest?.('.card');
    if (card && ev.key === 'Enter') return openSite(sites.find((x) => x.id === card.dataset.site));
    if (card && /^Arrow/.test(ev.key)) { ev.preventDefault(); const cards = [...card.parentElement.children]; const cols = getComputedStyle(card.parentElement).gridTemplateColumns.split(' ').length; const i = cards.indexOf(card); const step = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[ev.key]; cards[i + step]?.focus(); }
  }
  if ((ev.metaKey || ev.ctrlKey) && ev.altKey && ev.code === 'KeyL' && st.enabled) { ev.preventDefault(); st.screen = st.screen === 'sites' ? 'editor' : 'sites'; render(); }
});
document.addEventListener('focusout', (ev) => { if (ev.target.matches?.('[data-rename]')) { const v = ev.target.value.trim(); if (v) groupOf(ev.target.dataset.rename).name = v; st.renaming = null; setTimeout(render); } });
// Quick add: paste a URL anywhere outside a field.
document.addEventListener('paste', (ev) => {
  if (st.screen !== 'sites' || /INPUT|TEXTAREA/.test(ev.target.tagName) || document.querySelector('.scrim')) return;
  const text = (ev.clipboardData.getData('text') || '').trim();
  if (!/^https?:\/\/\S+$/i.test(text)) return;
  const g = groupOf(st.selected) ? st.selected : null;
  const n = { id: 'i' + uid++, title: host(text), url: text, description: '', group: g, pinned: false, icon: 'letter', isNew: true, fetching: true };
  sites.push(n); render(); setTimeout(() => { n.fetching = false; render(); }, 1500);
  toast(`已添加 ${esc(host(text))}${g ? ` 到「${esc(groupOf(g).name)}」` : ''}`, { label: '撤销', run: () => { sites = sites.filter((x) => x !== n); render(); } });
});
// Drag a card onto a sidebar group to move it.
let dragId = null;
document.addEventListener('dragstart', (ev) => { const c = ev.target.closest?.('[data-site]'); if (!c) return; dragId = c.dataset.site; c.classList.add('dragging'); ev.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragend', () => { dragId = null; document.querySelectorAll('.dragging,.drop').forEach((e) => e.classList.remove('dragging', 'drop')); });
document.addEventListener('dragover', (ev) => { const r = ev.target.closest?.('.sidebar [data-group]'); document.querySelectorAll('.drop').forEach((e) => e !== r && e.classList.remove('drop')); if (dragId && r && (groupOf(r.dataset.group) || r.dataset.group === 'none' || r.dataset.group === 'pinned')) { ev.preventDefault(); r.classList.add('drop'); } });
document.addEventListener('drop', (ev) => {
  const r = ev.target.closest?.('.sidebar [data-group]'); if (!dragId || !r) return; ev.preventDefault();
  const s = sites.find((x) => x.id === dragId); const g = r.dataset.group;
  if (g === 'pinned') { s.pinned = true; toast(`已将「${esc(s.title)}」设为常用`); }
  else { s.group = g === 'none' ? null : g; toast(`已移动到「${g === 'none' ? '未分组' : esc(groupOf(g).name)}」`); }
  render();
});

render();
document.getElementById('q')?.focus();
</script>
</body>
